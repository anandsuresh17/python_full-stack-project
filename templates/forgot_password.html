{% extends 'layout.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<h1>Forgot Password</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

{% if success %}
    <p>{{ success }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <label>Email</label>

    <input
        type="email"
        name="email"
        required
    >

    <br><br>

    <button type="submit">
        Send Temporary Password
    </button>

</form>

{% endblock %}
