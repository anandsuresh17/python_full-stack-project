<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body>

    <h2>Forgot Password</h2>

    {% if success %}
        <p style="color: green;">
            {{ success }}
        </p>
    {% endif %}

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="email">Enter your registered email:</label>
        <br><br>

        <input
            type="email"
            name="email"
            id="email"
            required
        >

        <br><br>

        <button type="submit">
            Reset Password
        </button>
    </form>

    <br>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</body>
</html>
