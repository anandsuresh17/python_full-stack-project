{% extends 'layout.html' %}

{% block title %}
Sign In
{% endblock %}

{% block content %}

<h1>Student Sign In</h1>

{% if success %}
    <p>{{ success }}</p>
{% endif %}

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
    >

    <br><br>

    <label>Password</label>
    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <label>
        <input
            type="checkbox"
            name="keep_logged_in"
        >
        Keep me logged in
    </label>

    <br><br>

    <button type="submit">
        Sign In
    </button>

</form>

<p>
    <a href="{% url 'forgot_password' %}">
        Forgot Password?
    </a>
</p>

{% endblock %}
