{% extends "layout.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}

<h1>Change Password</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <p>
        <label for="old_password">
            Existing Password:
        </label>
        <br>

        <input
            type="password"
            name="old_password"
            id="old_password"
            required
        >
    </p>

    <p>
        <label for="new_password">
            New Password:
        </label>
        <br>

        <input
            type="password"
            name="new_password"
            id="new_password"
            required
        >
    </p>

    <p>
        <label for="confirm_password">
            Confirm New Password:
        </label>
        <br>

        <input
            type="password"
            name="confirm_password"
            id="confirm_password"
            required
        >
    </p>

    <button type="submit">
        Save
    </button>

</form>

<br>

<form method="POST" action="{% url 'reset_password_email' %}">
    {% csrf_token %}

    <button type="submit">
        Forgot Password?
    </button>
</form>

<br>

<a href="{% url 'profile' %}">
    Cancel
</a>

{% endblock %}
