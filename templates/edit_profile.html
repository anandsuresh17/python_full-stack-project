{% extends "layout.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<h1>Edit Profile</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <p>
        <label for="country">
            Country:
        </label>

        <input
            type="text"
            name="country"
            id="country"
            value="{{ student.country }}"
        >
    </p>

    <p>
        <label for="state">
            State:
        </label>

        <input
            type="text"
            name="state"
            id="state"
            value="{{ student.state }}"
        >
    </p>

    <p>
        <label for="city">
            City:
        </label>

        <input
            type="text"
            name="city"
            id="city"
            value="{{ student.city }}"
        >
    </p>

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="{% url 'profile' %}">
    Cancel
</a>

{% endblock %}
