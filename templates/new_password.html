
<!DOCTYPE html>
<html>
<head>
    <title>Create New Password</title>
</head>

<body>

    <h2>Create New Password</h2>

    <p>
        Please create a new password to continue.
    </p>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="new_password">
            New Password:
        </label>

        <br><br>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
        >

        <br><br>

        <label for="confirm_password">
            Confirm Password:
        </label>

        <br><br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >

        <br><br>

        <button type="submit">
            Set New Password
        </button>

    </form>

</body>
</html>
