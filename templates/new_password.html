{% extends 'layout.html' %}

{% block title %}
Create New Password
{% endblock %}

{% block content %}

<div class="password-page">

    <div class="password-card">

        <h1>Create New Password</h1>

        <p class="password-subtitle">
            Please create a new password to continue.
        </p>


        {% if error %}

            <p class="error-message">
                {{ error }}
            </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >

            </div>


            <button type="submit">
                Set New Password
            </button>

        </form>

    </div>

</div>


<style>

.password-page {
    max-width: 450px;
    margin: 60px auto;
}


.password-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-top: 4px solid #f97316;
    border-radius: 12px;
    padding: 35px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
}


.password-card h1 {
    text-align: center;
    color: #172554;
    font-size: 28px;
    margin-bottom: 8px;
}


.password-subtitle {
    text-align: center;
    color: #666666;
    font-size: 14px;
    margin-bottom: 30px;
}


.form-group {
    margin-bottom: 20px;
}


.form-group label {
    display: block;
    color: #172554;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}


.form-group input[type="password"] {

    width: 100%;
    box-sizing: border-box;

    padding: 11px 13px;

    border: 1px solid #d1d5db;

    border-radius: 6px;

    font-family: 'Poppins', sans-serif;

    font-size: 14px;

    outline: none;

}


.form-group input:focus {
    border-color: #f97316;
}


button {

    width: 100%;

    border: none;

    background: #f97316;

    color: #ffffff;

    padding: 13px;

    border-radius: 6px;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

}


button:hover {
    background: #ea580c;
}


.error-message {

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #dc2626;

    padding: 10px 12px;

    border-radius: 6px;

    font-size: 13px;

    margin-bottom: 20px;

}


@media (max-width: 600px) {

    .password-page {
        margin: 30px 15px;
    }

    .password-card {
        padding: 25px 20px;
    }

}

</style>

{% endblock %}
