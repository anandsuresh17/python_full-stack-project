
{% extends 'layout.html' %}

{% block title %}
Create New Password
{% endblock %}

{% block content %}

<h1>Create New Password</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <label>New Password</label>
    <input
        type="password"
        name="new_password"
        required
    >

    <br><br>

    <label>Confirm New Password</label>
    <input
        type="password"
        name="confirm_password"
        required
    >

    <br><br>

    <button type="submit">
        Create Password
    </button>

</form>

{% endblock %}
